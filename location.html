<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location - Akiyama Corporation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { DEFAULT: '#10B981', dark: '#059669', black: '#0A0A0A', card: '#121212', border: '#222222' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brand-black text-gray-100 font-sans antialiased selection:bg-brand selection:text-black flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 bg-brand-black/80 backdrop-blur-md border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-xl bg-brand/10 border border-brand/25 flex items-center justify-center p-1.5 group-hover:border-brand/50 transition-all">
                    <svg viewBox="0 0 120 120" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="akiyamaSwoosh" x1="12" y1="88" x2="108" y2="22" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#059669" />
                                <stop offset="50%" stop-color="#10B981" />
                                <stop offset="100%" stop-color="#6EE7B7" />
                            </linearGradient>
                        </defs>
                        <path d="M24 27C46 18 74 18 96 27V63C96 86 78 100 60 109C42 100 24 86 24 63V27Z" stroke="#10B981" stroke-width="5.5" stroke-linejoin="round"/>
                        <path d="M60 21L41 64L53 59L60 42L67 52L76 47L60 21Z" fill="#10B981"/>
                        <path d="M36 75L27 94H43L49 80L36 75Z" fill="#10B981"/>
                        <path d="M71 66L82 94H96L81 59L71 66Z" fill="#10B981"/>
                        <path d="M16 93C13 83 22 72 45 64C71 55 94 42 106 16C101 44 82 62 49 74C29 81 20 87 16 93Z" fill="url(#akiyamaSwoosh)"/>
                    </svg>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-wider text-white">AKIYAMA</span>
                    <span class="text-xs block text-gray-400 tracking-widest">CORPORATION</span>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="home.html" class="text-gray-400 hover:text-brand transition-colors">Home</a>
                <a href="about.html" class="text-gray-400 hover:text-brand transition-colors">About Us</a>
                <a href="division.html" class="text-gray-400 hover:text-brand transition-colors">Division</a>
                <a href="structure.html" class="text-gray-400 hover:text-brand transition-colors">Structure</a>
                <a href="location.html" class="text-brand transition-colors font-semibold">Location</a>
                <a href="contact.html" class="text-gray-400 hover:text-brand transition-colors">Contact</a>
            </nav>

            <div class="hidden md:flex items-center">
                <a href="admin.html" id="admin-nav-btn" class="px-4 py-2 rounded-xl text-xs font-semibold tracking-wider bg-brand/10 border border-brand/30 text-brand hover:bg-brand hover:text-black transition-all duration-300 shadow-sm shadow-brand/5">Admin Panel</a>
            </div>

            <button id="menu-btn" class="md:hidden text-gray-400 hover:text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-brand-card border-b border-brand-border px-4 pt-2 pb-4 space-y-3">
            <a href="home.html" class="block text-gray-300 hover:text-brand py-2">Home</a>
            <a href="about.html" class="block text-gray-300 hover:text-brand py-2">About Us</a>
            <a href="division.html" class="block text-gray-300 hover:text-brand py-2">Division</a>
            <a href="structure.html" class="block text-gray-300 hover:text-brand py-2">Structure</a>
            <a href="location.html" class="block text-brand py-2 font-semibold">Location</a>
            <a href="contact.html" class="block text-gray-300 hover:text-brand py-2">Contact</a>
            <div class="pt-2 border-t border-brand-border">
                <a href="admin.html" id="mobile-admin-btn" class="block text-center py-2.5 rounded-xl bg-brand/10 border border-brand/30 text-brand text-xs font-semibold tracking-wider hover:bg-brand hover:text-black transition-all">Admin Panel</a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
        <div class="bg-brand-card border border-brand-border rounded-3xl p-6 sm:p-10 shadow-xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 sm:gap-12 items-center">
            <div class="w-full h-72 sm:h-96 rounded-2xl overflow-hidden border border-brand/40 bg-brand-black relative group">
                <img id="cms-loc-img" src="https://cdn.discordapp.com/attachments/1562155677986594869/1565032577792868564/akiyama_headquarter.png?ex=6afbd16b&is=6afa7feb&hm=8d0d3bd1781e417e4111650f4f01fe1237ea22db7c90e241418f83daa7013507" alt="Akiyama Corporation Headquarters" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            </div>

            <div class="space-y-4 text-left">
                <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight uppercase">
                    LOCATION <br><span class="text-brand">AKIYAMA CORPORATION</span>
                </h1>
                <p id="cms-loc-address" class="text-sm sm:text-base font-normal text-gray-400 leading-relaxed">
                    Jl. Utama Akiyama Headquarters, Los Santos / San Andreas
                </p>
            </div>
        </div>
    </main>

    <footer class="border-t border-brand-border bg-brand-card py-8 text-center text-xs text-gray-500">
        <p>© 2026 Akiyama Corporation. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
